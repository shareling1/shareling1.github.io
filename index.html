<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shareling · 祥澪</title>
<meta name="description" content="Shareling（祥澪）的个人主页 · 探索 · 分享 · 创造">
<link rel="icon" type="image/jpeg" href="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7edf1;            /* 头像底色：奶粉 */
  --ink: #5c4a5e;           /* 深紫灰文字 */
  --ink-soft: #96809a;
  --purple: #8b72c8;        /* 左眼紫 */
  --blue: #5c6fa8;          /* 右眼蓝 */
  --pink: #f2a9b8;          /* 腮红粉 */
  --scarf: #7d6483;         /* 围巾紫 */
  --card: rgba(255, 252, 253, 0.72);
  --shadow: 0 24px 70px rgba(125, 100, 131, 0.22);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: "Noto Sans SC", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 48px 20px;
  overflow-x: hidden;
}

/* ---------- 梦幻流动背景 ---------- */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .55;
  z-index: 0;
  animation: drift 18s ease-in-out infinite alternate;
}
.blob-1 { width: 46vw; height: 46vw; background: #f6c9d8; top: -12vw; left: -10vw; }
.blob-2 { width: 38vw; height: 38vw; background: #d5c8f0; bottom: -10vw; right: -8vw; animation-delay: -6s; }
.blob-3 { width: 30vw; height: 30vw; background: #c9d4f2; top: 40%; left: 55%; animation-delay: -12s; opacity: .4; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(4vw, -3vw) scale(1.12); }
}

/* ---------- 飘落的花瓣 ---------- */
.petal {
  position: fixed;
  top: -30px;
  z-index: 1;
  pointer-events: none;
  animation: fall linear infinite;
  will-change: transform;
}
@keyframes fall {
  to { transform: translateY(110vh) translateX(6vw) rotate(360deg); }
}

/* ---------- 主卡片 ---------- */
.container { position: relative; z-index: 2; width: 100%; max-width: 560px; }
.card {
  background: var(--card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  border-radius: 32px;
  padding: 46px 42px 38px;
  box-shadow: var(--shadow);
  text-align: center;
  animation: card-in .8s cubic-bezier(.22,1,.36,1) both;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(28px) scale(.97); }
  to   { opacity: 1; transform: none; }
}

/* ---------- 头像 ---------- */
.avatar-wrap { position: relative; width: 132px; margin: 0 auto 18px; animation: float 4.5s ease-in-out infinite; }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-9px); }
}
.avatar {
  width: 132px; height: 132px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 4px solid #fff;
  box-shadow: 0 10px 30px rgba(139, 114, 200, .28);
  transition: transform .5s cubic-bezier(.34,1.56,.64,1);
  cursor: pointer;
}
.avatar:hover { transform: rotate(-6deg) scale(1.06); }
.avatar-wrap::after {          /* 头顶的小星星 */
  content: "✦";
  position: absolute;
  top: -8px; right: -4px;
  font-size: 22px;
  color: var(--pink);
  animation: twinkle 2s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 1; transform: scale(1) rotate(0); }
  50%      { opacity: .4; transform: scale(.75) rotate(20deg); }
}

/* ---------- 名字与签名 ---------- */
h1 {
  font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
  font-size: 34px;
  font-weight: 400;
  letter-spacing: 1px;
  background: linear-gradient(120deg, var(--purple), var(--pink) 55%, var(--blue));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tagline {
  margin-top: 8px;
  font-size: 15px;
  color: var(--ink-soft);
  min-height: 24px;
}
.tagline .cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--purple);
  vertical-align: -2px;
  margin-left: 2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- 一言 ---------- */
.hitokoto {
  margin: 26px auto 0;
  padding: 14px 20px;
  max-width: 420px;
  font-size: 14px;
  line-height: 1.9;
  color: var(--scarf);
  background: rgba(213, 200, 240, 0.25);
  border-radius: 16px;
  position: relative;
}
.hitokoto::before { content: "「"; color: var(--purple); font-weight: 700; }
.hitokoto::after  { content: "」"; color: var(--purple); font-weight: 700; }
.hitokoto-from { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-soft); }

/* ---------- 关于 ---------- */
.about {
  margin-top: 24px;
  font-size: 14.5px;
  line-height: 2;
  color: var(--ink);
  opacity: .85;
}

/* ---------- 链接卡片 ---------- */
.links { margin-top: 28px; display: flex; flex-direction: column; gap: 13px; }
.link-item {
  display: flex; align-items: center; gap: 15px;
  padding: 15px 20px;
  background: rgba(255, 255, 255, 0.66);
  border: 1.5px solid rgba(255, 255, 255, 0.9);
  border-radius: 18px;
  text-decoration: none;
  color: var(--ink);
  text-align: left;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, background .25s;
}
.link-item:hover {
  transform: translateY(-3px) scale(1.015);
  background: #fff;
  box-shadow: 0 12px 28px rgba(139, 114, 200, .2);
}
.link-item:hover .link-arrow { transform: translateX(4px); color: var(--purple); }
.link-icon {
  width: 42px; height: 42px;
  border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: #fff;
}
.link-icon.github   { background: linear-gradient(135deg, #6e5c96, #4b3f66); }
.link-icon.github2  { background: linear-gradient(135deg, #a08cc0, #7d6483); }
.link-icon.bilibili { background: linear-gradient(135deg, #fb9db4, #f26d8d); }
.link-info { flex: 1; min-width: 0; }
.link-name { font-size: 15px; font-weight: 700; }
.link-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.link-arrow { color: #cbb8d6; font-size: 18px; transition: transform .25s, color .25s; }

/* ---------- 页脚 ---------- */
.footer {
  margin-top: 26px;
  text-align: center;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 2;
}
.footer .paw { display: inline-block; animation: twinkle 2.4s ease-in-out infinite; }

/* ---------- 点击爱心 ---------- */
.heart-pop {
  position: fixed;
  z-index: 99;
  pointer-events: none;
  font-size: 18px;
  animation: heart-up 1s ease-out forwards;
}
@keyframes heart-up {
  from { opacity: 1; transform: translateY(0) scale(.6); }
  to   { opacity: 0; transform: translateY(-70px) scale(1.25); }
}

@media (max-width: 520px) {
  .card { padding: 36px 24px 30px; border-radius: 26px; }
  h1 { font-size: 28px; }
  .avatar-wrap, .avatar { width: 112px; }
  .avatar { height: 112px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; }
}
</style>
</head>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

      🍎 沉迷折腾 iOS 相关技术<br>
      欢迎来串门，一起玩耍 ~
    </p>
        <div class="link-icon github">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        </div>
        <div class="link-info">
          <div class="link-name">GitHub</div>

        <div class="link-arrow">→</div>
      </a>

      <a class="link-item" href="https://github.com/sharelingshare" target="_blank" rel="noopener">

  <footer class="footer">
    <span class="paw">🐾</span> Made with ♡ by Shareling &amp; Claude · 2026<br>

<script>
/* ---------- 打字机签名 ---------- */
const phrases = ["探索 · 分享 · 创造", "音游玩家 · MC 挑战者", "欢迎来我的小窝玩呀 ~"];
const typedEl = document.getElementById("typed");
let pi = 0, ci = 0, deleting = false;
function type() {
  const cur = phrases[pi];
  typedEl.textContent = cur.slice(0, ci);
  if (!deleting) {
    if (ci < cur.length) { ci++; setTimeout(type, 110); }
    else { deleting = true; setTimeout(type, 2200); }
  } else {
    if (ci > 0) { ci--; setTimeout(type, 45); }
    else { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(type, 500); }
  }
}
type();

/* ---------- 一言 ---------- */
fetch("https://v1.hitokoto.cn/?c=a&c=b&c=d&c=i&encode=json")
  .then(r => r.json())
  .then(d => {
    document.getElementById("hitokoto-text").textContent = d.hitokoto;
    document.getElementById("hitokoto-from").textContent = d.from ? "—— " + d.from : "";
  })
  .catch(() => {});

/* ---------- 飘落花瓣 ---------- */
const petalChars = ["🌸", "✿", "❀", "✦", "·"];
for (let i = 0; i < 14; i++) {
  const p = document.createElement("span");
  p.className = "petal";
  p.textContent = petalChars[i % petalChars.length];
  p.style.left = Math.random() * 100 + "vw";
  p.style.fontSize = 10 + Math.random() * 12 + "px";
  p.style.opacity = 0.3 + Math.random() * 0.5;
  p.style.animationDuration = 9 + Math.random() * 10 + "s";
  p.style.animationDelay = -Math.random() * 18 + "s";
  document.body.appendChild(p);
}

/* ---------- 点击冒爱心 ---------- */
const hearts = ["💜", "💗", "🩷", "✨", "🐾"];
document.addEventListener("click", e => {
  const h = document.createElement("span");
  h.className = "heart-pop";
  h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
  h.style.left = e.clientX - 9 + "px";
  h.style.top = e.clientY - 12 + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 1000);
});

/* ---------- 小窝已运行 ---------- */
const birth = new Date("2026-07-26T00:00:00+08:00");
function tick() {
  const s = Math.max(0, (Date.now() - birth) / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60);
  document.getElementById("runtime").textContent = `小窝已运行 ${d} 天 ${h} 时 ${m} 分 ${sec} 秒`;
}
tick(); setInterval(tick, 1000);
</script>
